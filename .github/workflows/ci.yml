name: CI/CD Pipeline

on:
  pull_request:
    branches: [ main, develop ]
    paths: ['src/**', 'manifest.json', 'package.json']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint, Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Build extension
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: extension-build
          path: Output/
          retention-days: 7

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

  package-extension:
    name: Package Extension
    runs-on: ubuntu-latest
    needs: [lint-and-build]
    if: github.event_name == 'workflow_dispatch'
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Get version from manifest
        id: get_version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create ZIP archive
        run: cd Output && zip -r ../AssisT-v${{ steps.get_version.outputs.version }}.zip . && cd ..

      - uses: actions/upload-artifact@v4
        with:
          name: AssisT-v${{ steps.get_version.outputs.version }}
          path: AssisT-v${{ steps.get_version.outputs.version }}.zip
          retention-days: 90
