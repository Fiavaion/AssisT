<svg width="380" height="380" viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg" style="background: #fff">
  <text x="190" y="22" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">Rule of Thirds - Composition Grid</text>
  <!-- Image area background -->
  <rect x="30" y="40" width="320" height="290" fill="#f5f5f5" stroke="#999" stroke-width="1.5" />
  <!-- Vertical third lines -->
  <line x1="137" y1="40" x2="137" y2="330" stroke="#667eea" stroke-width="1.5" stroke-dasharray="6,4" />
  <line x1="243" y1="40" x2="243" y2="330" stroke="#667eea" stroke-width="1.5" stroke-dasharray="6,4" />
  <!-- Horizontal third lines -->
  <line x1="30" y1="137" x2="350" y2="137" stroke="#667eea" stroke-width="1.5" stroke-dasharray="6,4" />
  <line x1="30" y1="233" x2="350" y2="233" stroke="#667eea" stroke-width="1.5" stroke-dasharray="6,4" />
  <!-- Power points (intersections) -->
  <circle cx="137" cy="137" r="8" fill="#e53935" opacity="0.8" />
  <circle cx="243" cy="137" r="8" fill="#e53935" opacity="0.8" />
  <circle cx="137" cy="233" r="8" fill="#e53935" opacity="0.8" />
  <circle cx="243" cy="233" r="8" fill="#e53935" opacity="0.8" />
  <!-- Power point labels -->
  <text x="137" y="125" text-anchor="middle" font-size="8" fill="#c62828" font-weight="bold">FOCAL</text>
  <text x="243" y="125" text-anchor="middle" font-size="8" fill="#c62828" font-weight="bold">FOCAL</text>
  <text x="137" y="252" text-anchor="middle" font-size="8" fill="#c62828" font-weight="bold">FOCAL</text>
  <text x="243" y="252" text-anchor="middle" font-size="8" fill="#c62828" font-weight="bold">FOCAL</text>
  <!-- Example subject placement -->
  <rect x="220" y="60" width="50" height="170" fill="#43a047" opacity="0.3" rx="4" />
  <text x="245" y="155" text-anchor="middle" font-size="9" fill="#2e7d32" font-weight="600">Subject</text>
  <!-- Horizon line example -->
  <line x1="30" y1="233" x2="350" y2="233" stroke="#fb8c00" stroke-width="2" opacity="0.5" />
  <text x="60" y="228" font-size="8" fill="#e65100" font-weight="600">Horizon line</text>
  <!-- Zone labels -->
  <text x="83" y="92" text-anchor="middle" font-size="8" fill="#888">1/3</text>
  <text x="190" y="92" text-anchor="middle" font-size="8" fill="#888">1/3</text>
  <text x="297" y="92" text-anchor="middle" font-size="8" fill="#888">1/3</text>
  <!-- Bottom label -->
  <text x="190" y="360" text-anchor="middle" font-size="10" fill="#666">Rule of Thirds with focal point intersections</text>
</svg>
