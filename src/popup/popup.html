<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AssisT - TTS Controls</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="header-top">
        <button id="btn-reset" class="header-btn" title="Reset all settings to defaults" aria-label="Reset settings">
          <span class="header-btn-icon">🔄</span>
        </button>
        <h1>
          <span class="logo">🎯</span>
          AssisT
        </h1>
        <button id="btn-options" class="header-btn" title="Advanced options" aria-label="Open advanced options">
          <span class="header-btn-icon">⚙️</span>
        </button>
      </div>
      <p class="subtitle">Text-to-Speech Controls</p>
    </header>

    <!-- Main Controls -->
    <main class="popup-main">
      <!-- TTS Enable/Disable -->
      <section class="control-section">
        <div class="toggle-control main-toggle">
          <label for="tts-enabled" class="toggle-label">
            <span class="label-text">Enable TTS</span>
            <div class="toggle-switch">
              <input type="checkbox" id="tts-enabled" role="switch" aria-label="Enable Text-to-Speech">
              <span class="toggle-slider"></span>
            </div>
          </label>
        </div>
      </section>

      <!-- Options Container (shows when TTS enabled) -->
      <div id="options-container" class="options-container hidden">

      <!-- Playback Controls -->
      <section class="control-section" id="playback-controls">
        <h2 class="section-title">Playback</h2>
        <div class="button-group">
          <button id="btn-play" class="control-btn primary" aria-label="Start reading page">
            <span class="btn-icon">▶️</span>
            <span class="btn-text">Read Page</span>
          </button>
          <button id="btn-pause" class="control-btn" aria-label="Pause reading" disabled>
            <span class="btn-icon">⏸️</span>
            <span class="btn-text">Pause</span>
          </button>
          <button id="btn-stop" class="control-btn" aria-label="Stop reading" disabled>
            <span class="btn-icon">⏹️</span>
            <span class="btn-text">Stop</span>
          </button>
        </div>
      </section>

      <!-- Voice Selection -->
      <section class="control-section">
        <h2 class="section-title">
          <label for="voice-select">Voice</label>
        </h2>
        <select id="voice-select" class="voice-select" aria-label="Select voice">
          <option value="">Loading voices...</option>
        </select>
      </section>

      <!-- Rate Control -->
      <section class="control-section">
        <h2 class="section-title">
          <label for="rate-slider">Speed</label>
          <span class="control-value" id="rate-value">1.0x</span>
        </h2>
        <div class="slider-control">
          <input
            type="range"
            id="rate-slider"
            class="slider"
            min="0.5"
            max="2.0"
            step="0.1"
            value="1.0"
            aria-label="Adjust reading speed"
            aria-valuemin="0.5"
            aria-valuemax="2.0"
            aria-valuenow="1.0">
          <div class="slider-labels">
            <span>Slower</span>
            <span>Faster</span>
          </div>
        </div>

        <!-- Speed Presets (Sprint 2 Feature) -->
        <div id="speed-presets-container" class="speed-presets-container">
          <div class="preset-buttons">
            <button class="preset-btn" data-speed="0.5" aria-label="Set speed to 0.5x">0.5x</button>
            <button class="preset-btn" data-speed="1.0" aria-label="Set speed to 1.0x">1.0x</button>
            <button class="preset-btn" data-speed="1.5" aria-label="Set speed to 1.5x">1.5x</button>
            <button class="preset-btn" data-speed="2.0" aria-label="Set speed to 2.0x">2.0x</button>
          </div>
        </div>
      </section>

      <!-- Pitch Control -->
      <section class="control-section">
        <h2 class="section-title">
          <label for="pitch-slider">Pitch</label>
          <span class="control-value" id="pitch-value">1.0</span>
        </h2>
        <div class="slider-control">
          <input
            type="range"
            id="pitch-slider"
            class="slider"
            min="0.5"
            max="2.0"
            step="0.1"
            value="1.0"
            aria-label="Adjust voice pitch"
            aria-valuemin="0.5"
            aria-valuemax="2.0"
            aria-valuenow="1.0">
          <div class="slider-labels">
            <span>Lower</span>
            <span>Higher</span>
          </div>
        </div>
      </section>

      <!-- Volume Control -->
      <section class="control-section">
        <h2 class="section-title">
          <label for="volume-slider">Volume</label>
          <span class="control-value" id="volume-value">100%</span>
        </h2>
        <div class="slider-control">
          <input
            type="range"
            id="volume-slider"
            class="slider"
            min="0"
            max="1"
            step="0.1"
            value="1"
            aria-label="Adjust volume"
            aria-valuemin="0"
            aria-valuemax="1"
            aria-valuenow="1">
          <div class="slider-labels">
            <span>🔇</span>
            <span>🔊</span>
          </div>
        </div>
      </section>

      <!-- Highlighting Toggle -->
      <section class="control-section">
        <div class="toggle-control">
          <label for="highlight-enabled" class="toggle-label">
            <span class="label-text">Text Highlighting</span>
            <div class="toggle-switch">
              <input type="checkbox" id="highlight-enabled" role="switch" aria-label="Enable text highlighting" checked>
              <span class="toggle-slider"></span>
            </div>
          </label>
        </div>
      </section>

      <!-- Highlighting Options Container (shows when highlighting enabled) -->
      <div id="highlight-options-container" class="highlight-options-container">

      <!-- Highlight Color -->
      <section class="control-section">
        <h2 class="section-title">
          <label for="highlight-color">Highlight Color</label>
        </h2>
        <select id="highlight-color" class="voice-select" aria-label="Select highlight color">
          <option value="#FFFF00">Yellow (High Contrast)</option>
          <option value="#FFEB3B">Bright Yellow</option>
          <option value="#FFD700">Gold</option>
          <option value="#90EE90">Light Green</option>
          <option value="#87CEEB">Sky Blue</option>
          <option value="#FFB6C1">Light Pink</option>
          <option value="#DDA0DD">Plum</option>
          <option value="#F0E68C">Khaki</option>
        </select>
      </section>

      <!-- Highlight Opacity -->
      <section class="control-section">
        <h2 class="section-title">
          <label for="highlight-opacity">Highlight Opacity</label>
          <span class="control-value" id="opacity-value">70%</span>
        </h2>
        <div class="slider-control">
          <input
            type="range"
            id="highlight-opacity"
            class="slider"
            min="0.1"
            max="1"
            step="0.1"
            value="0.7"
            aria-label="Adjust highlight opacity"
            aria-valuemin="0.1"
            aria-valuemax="1"
            aria-valuenow="0.7">
          <div class="slider-labels">
            <span>Transparent</span>
            <span>Solid</span>
          </div>
        </div>
      </section>

      </div><!-- End highlight-options-container -->

      </div><!-- End options-container -->
    </main>

    <!-- Footer -->
    <footer class="popup-footer">
      <div class="status-bar">
        <span class="status-indicator" id="status-indicator">Ready</span>
      </div>
      <div class="footer-links">
        <a href="#" id="link-settings" class="footer-link">⚙️ Settings</a>
        <a href="https://github.com/MarJone/AssisT" target="_blank" class="footer-link">ℹ️ Help</a>
      </div>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
