        "text": "\u003cdiv class=\"govspeak\"\u003e\n\u003ch2 id=\"overview\"\u003eOverview\u003c/h2\u003e\n\n\u003cp\u003eThe Equality Act 2010 legally protects people from discrimination in the workplace and in wider society.\u003c/p\u003e\n\n\u003cp\u003eIt replaced previous anti-discrimination laws with a single act, making the law easier to understand and strengthening protection in some situations. It sets out the different ways in which it’s unlawful to treat someone.\u003c/p\u003e\n\n\u003cdiv class=\"call-to-action\"\u003e\n  \u003cp\u003eFind out more about:\u003c/p\u003e\n\n  \u003cul\u003e\n    \u003cli\u003e\n\u003ca href=\"https://www.gov.uk/discrimination-your-rights/types-of-discrimination\"\u003ewho is protected\u003c/a\u003e from discrimination\u003c/li\u003e\n    \u003cli\u003e\n\u003ca href=\"https://www.gov.uk/discrimination-your-rights/how-you-can-be-discriminated-against\"\u003ethe types of discrimination\u003c/a\u003e under the law\u003c/li\u003e\n    \u003cli\u003e\n\u003ca href=\"https://www.gov.uk/discrimination-your-rights/what-you-can-do\"\u003ewhat action you can take\u003c/a\u003e if you feel you’ve been unfairly discriminated against\u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n\n\u003ch2 id=\"age-discrimination\"\u003eAge discrimination\u003c/h2\u003e\n\n\u003cp\u003eThe Equality Act 2010 includes provisions that ban age discrimination against adults in the provision of services and public functions. The ban came into force in2012 and means it is unlawful to discriminate on the basis of age unless:  \u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003ethe practice is covered by an exception from the ban  \u003c/li\u003e\n  \u003cli\u003egood reason can be shown for the differential treatment (‘objective justification’)\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eThe ban on age discrimination is designed to ensure that the law prohibits only harmful treatment that results in genuinely unfair discrimination because of age. It does not outlaw the many instances of different treatment that are justifiable or beneficial.\u003c/p\u003e\n\n\u003cdiv class=\"call-to-action\"\u003e\n  \u003cp\u003eYou can read specific guidance for:\u003c/p\u003e\n\n  \u003cul\u003e\n    \u003cli\u003e\n\u003ca rel=\"external\" href=\"https://assets.publishing.service.gov.uk/media/5a78cddb40f0b62b22cbced3/age-discrimination-guide-sme.pdf\"\u003esmall businesses\u003c/a\u003e (PDF)\u003c/li\u003e\n    \u003cli\u003e\n\u003ca rel=\"external\" href=\"https://assets.publishing.service.gov.uk/media/5a78ca86e5274a2acd189d0f/age-discrimination-guide-clubs.pdf\"\u003eprivate clubs\u003c/a\u003e (PDF)\u003c/li\u003e\n    \u003cli\u003e\n\u003ca rel=\"external\" href=\"https://assets.publishing.service.gov.uk/media/5a78cde5ed915d0422065783/holiday-discrimination-age.pdf\"\u003ethe holiday sector\u003c/a\u003e (PDF)\u003c/li\u003e\n  \u003c/ul\u003e\n\n  \u003cp\u003eThere is also an overview of the \u003ca rel=\"external\" href=\"https://assets.publishing.service.gov.uk/media/5a7970a640f0b642860d81bc/age-discrimination-ban.pdf\"\u003eage discrimination ban for service providers and customers\u003c/a\u003e (PDF).\u003c/p\u003e\n\u003c/div\u003e\n\n\u003ch3 id=\"age-discrimination-exceptions\"\u003eAge discrimination: exceptions\u003c/h3\u003e\n\n\u003cp\u003eExceptions are:  \u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003eage-based concessions  \u003c/li\u003e\n  \u003cli\u003eage-related holidays  \u003c/li\u003e\n  \u003cli\u003eage verification  \u003c/li\u003e\n  \u003cli\u003eclubs and associations concessions  \u003c/li\u003e\n  \u003cli\u003efinancial services  \u003c/li\u003e\n  \u003cli\u003eimmigration  \u003c/li\u003e\n  \u003cli\u003eresidential park homes  \u003c/li\u003e\n  \u003cli\u003esport\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eThese specific exceptions are in addition to:  \u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003egeneral exceptions already allowed by the act  \u003c/li\u003e\n  \u003cli\u003epositive action measures  \u003c/li\u003e\n  \u003cli\u003e‘objective justification’\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eThere are no specific exceptions to the ban on age discrimination for health or social care services. This means that any age-based practices by the NHS and social care organisations need to be objectively justified, if challenged.\u003c/p\u003e\n\n\u003cdiv class=\"call-to-action\"\u003e\n  \u003cp\u003eRead more about \u003ca rel=\"external\" href=\"https://www.equalityhumanrights.com/equality/equality-act-2010/your-rights-under-equality-act-2010/age-discrimination#circumstanceswhenbeingtreateddifferentlyduetoageislawful\"\u003ecircumstances when being treated differently due to age is lawful\u003c/a\u003e (EHRC).\u003c/p\u003e\n\u003c/div\u003e\n\n\u003ch2 id=\"public-sector-equality-duty-psed\"\u003ePublic Sector Equality Duty (PSED)\u003c/h2\u003e\n\n\u003cp\u003eThe Public Sector Equality Duty came into force in England, Scotland and Wales in April 2011.\u003c/p\u003e\n\n\u003cp\u003eIt means that public bodies have to consider all individuals when carrying out their day-to-day work – in shaping policy, in delivering services and in relation to their own employees. \u003c/p\u003e\n\n\u003cp\u003eIt also requires that public bodies have due regard to the need to:  \u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003eeliminate discrimination  \u003c/li\u003e\n  \u003cli\u003eadvance equality of opportunity  \u003c/li\u003e\n  \u003cli\u003efoster good relations between different people when carrying out their activities\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003ePSED applies across England, Scotland and Wales to:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003ethe public bodies \u003ca href=\"https://www.gov.uk/government/publications/equality-act-2010-schedule-19-consolidated-april-2011\"\u003elisted in schedule 19 (as amended)\u003c/a\u003e\n\u003c/li\u003e\n  \u003cli\u003eany other organisation when it is carrying out a public function\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch3 id=\"specific-duties\"\u003eSpecific duties\u003c/h3\u003e\n\n\u003cp\u003eThe Equality Act 2010 (Specific Duties) Regulations 2011 came into force in September 2011.\u003c/p\u003e\n\n\u003cp\u003eThe specific duties require public bodies to publish relevant, proportionate information showing compliance with the Duty, and to set equality objectives.\u003c/p\u003e\n\n\u003cdiv class=\"call-to-action\"\u003e\n  \u003ch3 id=\"guidance-for-public-bodies\"\u003eGuidance for public bodies\u003c/h3\u003e\n\n  \u003cp\u003eWe have published the following guidance to help public bodies understand PSED:\u003c/p\u003e\n\n  \u003cul\u003e\n    \u003cli\u003e\u003ca href=\"https://www.gov.uk/government/publications/public-sector-equality-duty-guidance-for-public-authorities\"\u003ePublic Sector Equality Duty: guidance for public authorities\u003c/a\u003e\u003c/li\u003e\n  \u003c/ul\u003e\n\n  \u003cp\u003eThe Equality and Human Rights Commission (EHRC) has also published the following guidance:\u003c/p\u003e\n\n  \u003cul\u003e\n    \u003cli\u003e\n      \u003cp\u003e\u003ca rel=\"external\" href=\"https://www.equalityhumanrights.com/essential-guide-public-sector-equality-duty\"\u003eThe essential guide to the Public Sector Equality Duty\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n    \u003cli\u003e\n      \u003cp\u003e\u003ca rel=\"external\" href=\"https://www.equalityhumanrights.com/guidance/public-sector-equality-duty-and-data-protection\"\u003eThe Public Sector Equality Duty and data protection\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n    \u003cli\u003e\n      \u003cp\u003e\u003ca rel=\"external\" href=\"https://www.equalityhumanrights.com/guidance/public-sector/public-sector-equality-duty/technical-guidance-public-sector-equality-duty-0\"\u003eTechnical guidance on the Public Sector Equality Duty - England\u003c/a\u003e\u003c/p\u003e\n    \u003c/li\u003e\n  \u003c/ul\u003e\n\u003c/div\u003e\n\n\u003ch3 id=\"devolution\"\u003eDevolution\u003c/h3\u003e\n\n\u003cp\u003e\u003ca rel=\"external\" href=\"https://www.legislation.gov.uk/ukpga/2010/15/section/153\"\u003eSection 153 of the Equality Act\u003c/a\u003e allows the Welsh and Scottish ministers to impose specific duties on certain Welsh and Scottish public bodies through secondary legislation.\u003c/p\u003e\n\n\u003cp\u003eYou can read more about:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003e\u003ca rel=\"external\" href=\"https://www.legislation.gov.uk/ssi/2012/162/contents/made\"\u003eThe Equality Act 2010 (Specific Duties) (Scotland) Regulations 2012\u003c/a\u003e\u003c/li\u003e\n  \u003cli\u003e\u003ca rel=\"external\" href=\"https://www.legislation.gov.uk/wsi/2011/1064/contents\"\u003eThe Equality Act 2010 (Statutory Duties) (Wales) Regulations 2011\u003c/a\u003e\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cp\u003eYou can also read guidance from EHRC on complying with specific PSED duties in \u003ca rel=\"external\" href=\"https://www.equalityhumanrights.com/guidance/public-sector/public-sector-equality-duty/public-sector-equality-duty-specific-duties-0\"\u003eScotland\u003c/a\u003e and \u003ca rel=\"external\" href=\"https://www.equalityhumanrights.com/guidance/public-sector/public-sector-equality-duty/public-sector-equality-duty-specific-duties\"\u003eWales\u003c/a\u003e.\u003c/p\u003e\n\n\u003ch2 id=\"equality-act-2010-legislation\"\u003eEquality Act 2010: legislation\u003c/h2\u003e\n\n\u003cp\u003eSee the \u003ca rel=\"external\" href=\"http://www.legislation.gov.uk/ukpga/2010/15/contents\"\u003eEquality Act 2010\u003c/a\u003e and \u003ca rel=\"external\" href=\"http://www.legislation.gov.uk/ukpga/2010/15/notes/contents\"\u003eexplanatory notes\u003c/a\u003e.\u003c/p\u003e\n\n\u003cp\u003eYou can also see:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003eall Statutory Instruments made under the act for \u003ca rel=\"external\" href=\"http://www.legislation.gov.uk/uksi?title=Equality%20Act%202010\"\u003ethe UK\u003c/a\u003e, \u003ca rel=\"external\" href=\"http://www.legislation.gov.uk/wsi?title=Equality%20Act%202010\"\u003eWales\u003c/a\u003e and \u003ca rel=\"external\" href=\"http://www.legislation.gov.uk/ssi?title=Equality%20Act%202010\"\u003eScotland\u003c/a\u003e\n\u003c/li\u003e\n  \u003cli\u003eall legislation that was repealed or revoked on 1 October 2010 in \u003ca rel=\"external\" href=\"https://www.legislation.gov.uk/ukpga/2010/15/schedule/27\"\u003eschedule 27 to the act\u003c/a\u003e\n\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003ch2 id=\"guidance-on-the-equality-act\"\u003eGuidance on the Equality Act\u003c/h2\u003e\n\n\u003cp\u003eRead more guidance on topics including:\u003c/p\u003e\n\n\u003cul\u003e\n  \u003cli\u003ehow the Equality Act 2010 defines disability\u003c/li\u003e\n  \u003cli\u003ewhat law changes mean for the public, businesses, and the public and voluntary sectors\u003c/li\u003e\n\u003c/ul\u003e\n\n\u003cdiv class=\"call-to-action\"\u003e\n  \u003cp\u003e\u003ca href=\"https://www.gov.uk/government/publications/equality-act-guidance\"\u003eEquality Act 2010: how it might affect you\u003c/a\u003e\u003c/p\u003e\n\u003c/div\u003e\n\u003c/div\u003e"
      }
    }
